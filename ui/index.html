<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pier Forces · ETABS → TQS</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="boot" id="boot"><div class="spinner" style="width:28px;height:28px;border-width:3px"></div></div>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4B8DF8"/><stop offset="1" stop-color="#1B3F8F"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="14" fill="url(#lg)"/>
        <path d="M13 44.5h38" stroke="#fff" stroke-opacity=".28" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M13 34h38" stroke="#fff" stroke-opacity=".28" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M13 23.5h38" stroke="#fff" stroke-opacity=".28" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M20 14v37h24V14" stroke="#fff" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="square" fill="none"/>
        <circle cx="44" cy="14" r="4.2" fill="#F2B84B"/>
      </svg>
      <div>
        <div class="name">Pier Forces</div>
        <div class="kick">ETABS → TQS</div>
      </div>
    </div>
    <ol class="steps" id="steps"></ol>
    <div class="rail-foot">
      <div class="status-card" id="apiStatus">
        <span class="dot wait"></span><span class="l1">Conectando à API…</span><span class="l2">ETABS</span>
      </div>
      <div class="rail-row">
        <span id="ver">v—</span>
        <div class="seg" id="themeSeg">
          <button data-theme="dark" title="Tema escuro"></button>
          <button data-theme="light" title="Tema claro"></button>
        </div>
      </div>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div>
        <div class="kicker" id="kicker"></div>
        <div class="title" id="title"></div>
        <div class="subtitle" id="subtitle"></div>
      </div>
      <div id="modelChip"></div>
    </header>
    <section class="content" id="content"></section>
    <div class="drawer" id="drawer">
      <div class="dh">
        <span class="card-t">Log</span>
        <div class="spacer"></div>
        <button class="btn ghost sm" id="logCopy"></button>
        <button class="btn ghost sm icon" id="logClose" title="Fechar"></button>
      </div>
      <div class="body" id="logBody"></div>
    </div>
    <footer class="actionbar">
      <div class="left">
        <button class="btn ghost sm logbtn" id="logBtn"></button>
        <span class="hint" id="hint"></span>
      </div>
      <div class="right" id="actions"></div>
    </footer>
  </main>
</div>

<div class="toasts" id="toasts"></div>
<div id="modalRoot"></div>
<script src="app.js"></script>
</body>
</html>
